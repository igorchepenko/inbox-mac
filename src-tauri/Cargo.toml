[package]
name = "inbox"
version = "0.1.0"
description = "Inbox: личные задачи для macOS"
edition = "2021"

[lib]
name = "inbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Уведомления через UNUserNotificationCenter, см. src/notify.rs
[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
# Окно быстрого ввода как NSPanel, которая не активирует приложение (lib.rs, quick_panel). Та же версия, что у tao
objc2 = "0.6"
